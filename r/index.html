<!DOCTYPE html>
<!--
  Página del QR del póster de la semana (WeekAchievementScreen → AchievementPoster).
  La sirve GitHub Pages en https://tonigallego87.github.io/GymToni/r/?id=<rutina>
  (base en lib/routineShare.ts → ROUTINE_WEB_BASE).

  - Con ?id: "Abrir la rutina en GymBro" lanza gymbro://public-routine?id=...
    con un intent de Android; si la app no está instalada, Chrome sigue el
    browser_fallback_url y abre la ficha de Google Play.
  - Sin id (rutina no publicada): solo invita a descargar la app.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>GymBro</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-top: #1a1d24;
        --bg-bottom: #0f1115;
        --text: #f5f7fa;
        --text-muted: #98a0ae;
        --gold: #f7cc3d;
        --on-gold: #1a1d24;
        --border: #2c3140;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
      }
      main {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      img.wordmark {
        width: 220px;
        max-width: 70%;
        height: auto;
        margin-bottom: 32px;
      }
      h1 {
        font-size: 1.7rem;
        line-height: 1.2;
        margin: 0 0 12px;
      }
      p {
        color: var(--text-muted);
        line-height: 1.5;
        margin: 0 0 32px;
      }
      a.button {
        display: block;
        padding: 16px 20px;
        border-radius: 16px;
        font-weight: 700;
        font-size: 1.05rem;
        text-decoration: none;
        margin-bottom: 12px;
      }
      a.primary {
        background: var(--gold);
        color: var(--on-gold);
      }
      a.secondary {
        border: 2px solid var(--border);
        color: var(--text);
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <img class="wordmark" src="../assets/title.png" alt="GymBro" />
      <h1 id="title"></h1>
      <p id="body"></p>
      <a id="open" class="button primary" hidden></a>
      <a id="store" class="button secondary"></a>
    </main>
    <script>
      (function () {
        var PACKAGE = 'com.tonigallego.gymbro';
        var PLAY = 'https://play.google.com/store/apps/details?id=' + PACKAGE;

        var en = !/^es\b/i.test(navigator.language || 'es');
        var text = en
          ? {
              routineTitle: 'Someone shared a routine with you',
              routineBody:
                'Open it in GymBro to see its days and exercises and train it. If you don’t have the app yet, you’ll go to Google Play.',
              appTitle: 'Train with GymBro',
              appBody:
                'Log your workouts in seconds, track your progress and share your weeks.',
              open: 'Open the routine in GymBro',
              store: 'Get GymBro on Google Play',
            }
          : {
              routineTitle: 'Te han pasado una rutina',
              routineBody:
                'Ábrela en GymBro para ver sus días y ejercicios y entrenarla. Si aún no tienes la app, irás a Google Play.',
              appTitle: 'Entrena con GymBro',
              appBody:
                'Apunta tus entrenos en segundos, sigue tu progreso y comparte tus semanas.',
              open: 'Abrir la rutina en GymBro',
              store: 'Descargar GymBro en Google Play',
            };
        document.documentElement.lang = en ? 'en' : 'es';

        var id = new URLSearchParams(location.search).get('id') || '';
        // Mismo filtro que parsePublicRoutineLink en la app.
        if (!/^[A-Za-z0-9_-]{1,64}$/.test(id)) id = '';

        var store = document.getElementById('store');
        store.textContent = text.store;
        store.href = PLAY;

        if (!id) {
          document.getElementById('title').textContent = text.appTitle;
          document.getElementById('body').textContent = text.appBody;
          return;
        }

        document.getElementById('title').textContent = text.routineTitle;
        document.getElementById('body').textContent = text.routineBody;
        var open = document.getElementById('open');
        open.textContent = text.open;
        open.hidden = false;
        var isAndroid = /android/i.test(navigator.userAgent);
        open.href = isAndroid
          ? 'intent://public-routine?id=' +
            encodeURIComponent(id) +
            '#Intent;scheme=gymbro;package=' +
            PACKAGE +
            ';S.browser_fallback_url=' +
            encodeURIComponent(PLAY) +
            ';end'
          : 'gymbro://public-routine?id=' + encodeURIComponent(id);
      })();
    </script>
  </body>
</html>
